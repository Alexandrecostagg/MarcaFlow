name: MarcaFlow CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}

    - name: Run tests
      run: node tests/run.js

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results-${{ matrix.node-version }}
        path: test-results/

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' && secrets.FIREBASE_SERVICE_ACCOUNT != ''

    steps:
    - uses: actions/checkout@v4

    - name: Deploy to Cloudflare Pages
      uses: cloudflare/pages-action@v1
      with:
        apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        projectName: marcaflow
        directory: public/
        branch: main

    - name: Deploy Firestore Rules
      uses: w9jds/firebase-action@v13
      with:
        args: deploy --only firestore:rules --project marcaflow-inpi
      env:
        GCP_SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

  security:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Check for leaked secrets
      run: |
        if grep -rnE "MarcaFlow@|BEGIN [A-Z ]*PRIVATE|sk_live|AKIA[0-9A-Z]{16}" public/ functions/; then
          echo "⚠️  Possíveis segredos em código"
          exit 1
        fi
      continue-on-error: true

    - name: Check CSP headers
      run: |
        if ! grep -q "Content-Security-Policy" public/_headers; then
          echo "⚠️  Missing CSP headers"
          exit 1
        fi
