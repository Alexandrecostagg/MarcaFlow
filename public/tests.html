<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MarcaFlow — Testes</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 820px; margin: 2rem auto; padding: 0 1rem; background: #f5f7f6; color: #1d2925; }
    h1 { color: #126b52; }
    .test-suite { margin: 1rem 0; padding: 1rem; background: white; border-radius: 8px; border: 1px solid #dce5e1; }
    .test-suite h2 { margin-top: 0; font-size: 16px; }
    .test-result { padding: 3px 0; font-size: 13px; font-family: ui-monospace, monospace; }
    .pass { color: #126b52; }
    .fail { color: #a63b34; font-weight: 600; }
    .summary { padding: 1rem; background: white; border-radius: 8px; border: 1px solid #dce5e1; margin-top: 1rem; }
  </style>
</head>
<body>
  <h1>MarcaFlow — Suite de Testes</h1>
  <p>Testa a API real dos módulos (<code>store.js</code>, <code>business.js</code>, <code>utils.js</code>).</p>
  <div id="results"></div>
  <div id="summary"></div>

  <script type="module">
import { load, save, data, client, processById, ensureCollections, setData } from "./store.js?v=2026.08.29";
import {
  formatDate, daysUntil, processRisk, formatMoney, parseClasses,
  filterProcesses, classByCode, calculateEstimate, availabilityRisk
} from "./business.js?v=2026.08.29";
import { escapeHtml, sanitizeXmlText, validateJsonPayload, sanitizeAgentInput } from "./utils.js?v=2026.08.29";

const results = [];
let passCount = 0;
let failCount = 0;

function test(name, fn) {
  try {
    fn();
    passCount++;
    results.push({ pass: true, message: name });
  } catch (error) {
    failCount++;
    results.push({ pass: false, message: `${name} — ${error.message}` });
  }
}

function render() {
  const container = document.getElementById("results");
  container.innerHTML = "";
  const suite = document.createElement("div");
  suite.className = "test-suite";
  suite.innerHTML = `<h2>${results.length} testes (${passCount} passaram)</h2>`;
  container.appendChild(suite);
  for (const r of results) {
    const div = document.createElement("div");
    div.className = `test-result ${r.pass ? "pass" : "fail"}`;
    div.textContent = `${r.pass ? "✓" : "✗"} ${r.message}`;
    suite.appendChild(div);
  }
  document.getElementById("summary").innerHTML =
    `<h2>Resultado: ${passCount}/${results.length} passaram</h2>` +
    (failCount ? `<p class="fail">Há ${failCount} falha(s).</p>` : "<p>Todos os testes passaram.</p>");
}

// ===== DATA LAYER =====
test("load retorna workspace com coleções esperadas", () => {
  const workspace = load();
  for (const key of ["clients", "processes", "documents", "movements", "imports", "diagnoses", "availabilityChecks"]) {
    if (!Array.isArray(workspace[key])) throw new Error(`Falta coleção ${key}`);
  }
});

test("save persiste no localStorage", () => {
  data.clients.push({ id: "c-browser-save", name: "Teste" });
  save();
  const reloaded = load();
  if (!reloaded.clients.some(c => c.id === "c-browser-save")) throw new Error("Cliente não persistiu");
});

test("client retorna fallback para id inexistente", () => {
  const result = client("nao-existe");
  if (!result || typeof result.name !== "string") throw new Error("Fallback ausente");
});

test("processById encontra processo existente", () => {
  const target = data.processes[0];
  if (!target) return;
  if (processById(target.id) !== target) throw new Error("processById não encontrou o processo");
});

test("ensureCollections normaliza processo e nextAction", () => {
  data.processes.push({ id: "x", status: "Registrado" });
  ensureCollections();
  const item = data.processes.find(p => p.id === "x");
  if (item.flowStage !== "Registro") throw new Error(`Etapa "${item.flowStage}"`);
  if (!item.nextAction) throw new Error("nextAction não inicializado");
});

test("setData substitui o workspace preservando a referência", () => {
  const before = data;
  setData({ clients: [], processes: [{ id: "p1", brand: "X" }], documents: [], movements: [], imports: [] });
  if (before !== data) throw new Error("Referência exportada mudou");
  if (data.processes[0].brand !== "X") throw new Error("Coleção não substituída");
});

// ===== BUSINESS =====
test("formatDate formata data pt-BR", () => {
  const result = formatDate("2024-12-31");
  if (!result.includes("31") || !result.includes("2024")) throw new Error(result);
});

test("formatDate retorna Sem prazo para vazio", () => {
  if (formatDate("") !== "Sem prazo") throw new Error("Fallback inválido");
});

test("daysUntil prazo passado é negativo", () => {
  if (!(daysUntil("2020-01-01") < 0)) throw new Error("Deveria ser negativo");
});

test("processRisk atrasado = overdue", () => {
  if (processRisk({ internalDeadline: "2020-01-01" }) !== "overdue") throw new Error("Esperava overdue");
});

test("processRisk prazo distante = ok", () => {
  if (processRisk({ internalDeadline: "2099-01-01" }) !== "ok") throw new Error("Esperava ok");
});

test("formatMoney formata BRL", () => {
  const result = formatMoney(1000);
  if (!result.includes("R$") || !result.includes("1.000,00")) throw new Error(result);
});

test("parseClasses normaliza lista", () => {
  const result = parseClasses("25, 35 ,9");
  if (JSON.stringify(result) !== JSON.stringify(["25", "35", "9"])) throw new Error(JSON.stringify(result));
});

test("filterProcesses retorna array", () => {
  if (!Array.isArray(filterProcesses())) throw new Error("Esperava array");
});

test("classByCode resolve classe válida", () => {
  if (!classByCode("9")) throw new Error("Classe 9 deveria existir");
});

test("classByCode vazio para classe inválida", () => {
  if (classByCode("99") != null) throw new Error("Classe 99 não deveria existir");
});

test("calculateEstimate retorna totais numéricos", () => {
  const result = calculateEstimate(2, "preApproved", {});
  if (typeof result.total !== "number" || result.total <= 0) throw new Error("Total inválido");
});

test("availabilityRisk classifica candidato", () => {
  const target = { brand: "AURORA", classes: ["25", "35"] };
  const candidate = { brand: "AURORA MODA", classes: ["25"], status: "Registro em vigor" };
  const result = availabilityRisk(target, candidate);
  if (!["Alto", "Médio", "Baixo"].includes(result)) throw new Error(`Risco inválido: ${result}`);
});

// ===== UTILS =====
test("escapeHtml escapa tags", () => {
  if (escapeHtml("<script>alert(1)<\/script>").includes("<script>")) throw new Error("HTML não escapado");
    });

    test("sanitizeXmlText bloqueia script", () => {
      let threw = false;
      try { sanitizeXmlText("<script>alert(1)<\/script>"); } catch (_) { threw = true; }
      if (!threw) throw new Error("XML perigoso não bloqueado");
    });

    test("sanitizeXmlText aceita XML seguro", () => {
      const safe = "<revista><despachos></despachos></revista>";
      if (sanitizeXmlText(safe) !== safe) throw new Error("XML seguro alterado");
    });

    test("validateJsonPayload rejeita JSON inválido", () => {
      let threw = false;
      try { validateJsonPayload("{not json"); } catch (_) { threw = true; }
      if (!threw) throw new Error("JSON inválido aceito");
    });

    test("sanitizeAgentInput remove script", () => {
      const result = sanitizeAgentInput("oi <script>alert(1)<\/script> mundo");
      if (result.includes("<script>") || result.includes("<\/script>")) throw new Error("Input não sanitizado");
    });

    render();
  </script>
</body>
</html>
